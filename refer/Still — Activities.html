<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still — Activities</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#000;--glow-backdrop:rgba(40,95,160,.20);--accent:#AFDDFF;--accent-hi:#C8E8FF;--accent-core:#F2FAFF;--text:#fff;--muted:rgba(255,255,255,.5);--faint:rgba(255,255,255,.28);--track:rgba(255,255,255,.10);--hair:rgba(255,255,255,.08);--hud-border:rgba(255,255,255,.12);
--font-label:"JetBrains Mono",ui-monospace,Consolas,monospace;--ease-out:cubic-bezier(.16,1,.3,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-label)}
body{display:grid;place-items:center;overflow:auto}
.app{width:min(900px,100vw);height:min(720px,100vh);display:flex;border:1px solid var(--hair);overflow:hidden;position:relative;text-transform:uppercase;letter-spacing:.04em;font-size:12px}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 45% 38% at 60% 32%,var(--glow-backdrop),transparent)}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-transform:inherit;letter-spacing:inherit}
button:focus-visible,input:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
svg{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.label{font-size:10px;letter-spacing:.12em;color:var(--muted)}
.side{width:216px;transition:width 1.1s var(--ease-out);flex:none;border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:16px 12px;gap:4px;position:relative;z-index:1;background:rgba(2,4,7,.85)}
.side-top{display:flex;align-items:center;justify-content:space-between;height:40px;margin-bottom:16px;padding:0 6px}
.nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:999px;color:var(--muted);font-size:13px;width:100%;text-align:left}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav.active{color:var(--accent);background:rgba(175,221,255,.08)}
.nav.active svg{filter:drop-shadow(0 0 4px rgba(175,221,255,.6))}
.app.collapsed .side{width:64px}.app.collapsed .brand,.app.collapsed .nav span{display:none}.app.collapsed .side-top{justify-content:center;padding:0}.app.collapsed .nav{padding:0;justify-content:center}
.icon-btn{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}.icon-btn:hover{color:var(--text);background:var(--hair)}.icon-btn svg{width:18px;height:18px}
.spacer{flex:1}
.ic{width:36px;height:36px;border-radius:999px;border:1px solid var(--hud-border);display:grid;place-items:center;color:var(--muted);flex:none;transition:all .6s}
.ic svg{width:17px;height:17px}.def .ic{color:var(--accent);border-color:rgba(175,221,255,.35);background:rgba(175,221,255,.08)}.def .ic svg{filter:drop-shadow(0 0 4px rgba(175,221,255,.6))}
.hero{display:block;padding:10px 12px;border-radius:18px}
.orb{width:72px;height:72px;flex:none;border-radius:50%;border:1px solid var(--hair);display:grid;place-items:center}
.orb i{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,var(--accent-core),var(--accent) 28%,rgba(175,221,255,.12) 62%,transparent 72%);animation:br 10s ease-in-out infinite}
.orb.none i{opacity:.12;animation:none}
@keyframes br{0%,100%{transform:scale(.55);opacity:.55}50%{transform:scale(1.05);opacity:1}}
.hi{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hi .ti{font-size:20px;font-weight:500;letter-spacing:-.01em;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.tile{border:1px solid var(--hud-border);border-radius:14px;background:rgba(255,255,255,.02);height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);transition:all .2s}
.tile svg{width:16px;height:16px}.tile b{font-weight:400;font-size:22px;line-height:1;color:var(--accent);text-shadow:0 0 14px rgba(175,221,255,.45);font-variant-numeric:tabular-nums}
.tile:hover{border-color:var(--accent)}.tile.on{border-color:rgba(175,221,255,.55);background:rgba(175,221,255,.08);color:var(--accent)}
.tile span{font-size:9px;letter-spacing:.12em}
.cyc{display:flex;gap:3px;height:6px}.cyc i{border-radius:3px;background:var(--accent)}
.cl{display:flex;gap:3px;font-size:9px;color:var(--faint)}.cl span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.side{transition:none}.orb i{animation:none}}
.main{flex:1;min-width:0;padding:24px;display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto minmax(0,1fr);gap:16px;position:relative;z-index:1}
.hero{grid-column:1/-1}.card{position:relative;border:1px solid var(--hair);border-radius:20px;background:rgba(255,255,255,.025);padding:22px 18px;min-height:0;display:flex;flex-direction:column;min-width:0}
.card::before{content:"";position:absolute;top:-1px;left:18%;right:18%;height:1px;background:linear-gradient(90deg,transparent,rgba(175,221,255,.55),transparent)}
h2{font-weight:500;font-size:16px;letter-spacing:-.01em;text-transform:none}
.sub{font-size:11px;color:var(--faint);line-height:1.7;margin:8px 0 12px;text-transform:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--hud-border);font-size:10px;white-space:nowrap;flex:none;color:var(--muted);transition:border-color .2s,color .2s,background .2s}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.on{color:var(--accent);background:rgba(175,221,255,.08);border-color:rgba(175,221,255,.35)}
.pick{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid rgba(175,221,255,.35);background:rgba(175,221,255,.08);border-radius:14px;padding:8px 12px;margin-bottom:10px;font-size:10px;letter-spacing:.12em;color:var(--accent)}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--track) transparent}
.row{display:flex;align-items:center;gap:8px;border:1px solid var(--hair);border-radius:16px;padding:10px 12px;transition:border-color .6s}
.row.def{border-color:rgba(175,221,255,.35)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:10px;color:var(--muted);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-right:8px;vertical-align:1px}
.def .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.x{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;color:var(--faint);flex:none}
.x:hover{color:var(--text);background:var(--hair)}
.x svg{width:13px;height:13px}
.empty{font-size:11px;color:var(--faint);text-transform:none;padding:12px 4px}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.types .tile{height:56px;gap:6px}.types .tile svg{width:18px;height:18px}
.form{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--track) transparent}
.f{display:flex;flex-direction:column;gap:6px}
input,textarea{width:100%;border:1px solid var(--hud-border);border-radius:12px;padding:9px 12px;font-size:12px;cursor:text;background:rgba(255,255,255,.02);text-transform:none;letter-spacing:0}
textarea{resize:none;height:48px;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus{border-color:var(--accent);outline:0}
.ph{display:grid;grid-template-columns:1fr 64px 26px;gap:6px;align-items:center}
.addph{align-self:flex-start}
.hint{font-size:10px;color:var(--muted);letter-spacing:.08em}
.btn{margin-top:12px;height:42px;padding:0 24px;border-radius:999px;background:var(--accent);color:#000;font-weight:500;font-size:13px;align-self:center;transition:background .2s}
.btn:hover{background:var(--accent-hi)}
.err{color:var(--muted);font-size:10px;min-height:12px;text-transform:none}
</style>
</head>
<body>
<div class="app collapsed" id="app">
  <aside class="side">
    <div class="side-top"><span class="brand label">Still</span><button class="icon-btn" id="tg" aria-label="Toggle sidebar"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg></button></div>
    <button class="nav"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></svg><span>Focus</span></button>
    <button class="nav active"><svg viewBox="0 0 24 24"><path d="M4 12h3l2.5-6 4 12 2.5-6H20"/></svg><span>Activities</span></button>
    <div class="spacer"></div>
    <button class="nav"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.5 1.5M16.5 16.5L18 18M6 18l1.5-1.5M16.5 7.5L18 6"/></svg><span>Settings</span></button>
  </aside>
  <main class="main">
    <section class="card hero" id="hero"></section>
    <section class="card">
      <h2>Your activities</h2>
      <p class="sub">Tap a tile above to filter. Set one as your default.</p>
      <div class="pick" id="pick"><span>Choosing for Rest 2</span><button class="pill" id="cancel">Cancel</button></div>
      <div class="list" id="list"></div>
    </section>
    <section class="card">
      <h2>Add activity</h2>
      <p class="sub">Pick a type, then fill it in.</p>
      <div class="types" id="types"></div>
      <div class="form" id="form"></div>
      <div class="err" id="err" style="text-align:center"></div>
      <button class="btn" id="add">Add to library</button>
    </section>
  </main>
</div>
<script>
const $=s=>document.querySelector(s);
const IC={all:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/>',breathing:'<path d="M3 9h11a3 3 0 1 0-3-3M3 15h14a3 3 0 1 1-3 3M3 12h7"/>',custom:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16v4M17 18h4"/>',youtube:'<rect x="3" y="6" width="18" height="12" rx="4"/><path d="M10.5 9.5v5l4.2-2.5z"/>',spotify:'<circle cx="12" cy="12" r="9"/><path d="M7 9.5c3.5-1 7.5-.6 10.5 1.2M7.8 12.5c2.8-.8 6-.4 8.4 1M8.6 15.4c2.2-.6 4.5-.3 6.4.8"/>'};
const svg=k=>`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;
const TYPES={breathing:'Breathing',custom:'Custom',youtube:'YouTube',spotify:'Spotify'};
let id=10,picking=true,filter='all',kind='breathing',phases=[{l:'Inhale',s:4},{l:'Exhale',s:6}],defId='b1',chosen=null;
let lib=[
 {id:'b1',type:'breathing',name:'Box breathing',built:1,phases:[['Inhale',4],['Hold',4],['Exhale',4],['Hold',4]]},
 {id:'b2',type:'breathing',name:'4-7-8 breathing',built:1,phases:[['Inhale',4],['Hold',7],['Exhale',8]]},
 {id:'b3',type:'breathing',name:'Coherence',built:1,phases:[['Inhale',5],['Exhale',5]]},
 {id:'c1',type:'custom',name:'Walk outside',min:10,note:'Leave the screen. Stretch your legs.'},
 {id:'y1',type:'youtube',name:'Desk stretch routine',url:'https://youtube.com/watch?v=example'}];
const meta=a=>a.type==='breathing'?`Breathing · ${a.phases.map(p=>p[1]).join('-')} · ${a.phases.reduce((n,p)=>n+p[1],0)}s cycle${a.built?' · built-in':''}`
 :a.type==='custom'?`Custom · ${a.min} min · timed`:`${TYPES[a.type]} · link · you end it`;
const x='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function row(a){const d=a.id===defId;
 return `<div class="row ${d?'def':''}"><div class="ic">${svg(a.type)}</div><div class="t"><span class="name">${esc(a.name)}</span><span class="meta">${meta(a)}</span>${a.note?`<span class="meta" style="color:var(--faint);text-transform:none;letter-spacing:0">“${esc(a.note)}”</span>`:''}</div>
 ${picking?`<button class="pill ${chosen===a.id?'on':''}" data-use="${a.id}">${chosen===a.id?'Chosen':'Use'}</button>`:''}
 <button class="pill ${d?'on':''}" data-def="${a.id}">${d?'Default':'Set default'}</button>
 ${a.built?'':`<button class="x" data-del="${a.id}" aria-label="Delete">${x}</button>`}</div>`}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
 const df=lib.find(a=>a.id===defId);
 $('#hero').innerHTML=`<div class="tiles">${[['all','All'],...Object.entries(TYPES)].map(([k,v])=>`<button class="tile ${filter===k?'on':''}" data-f="${k}">${svg(k)}<b>${k==='all'?lib.length:lib.filter(a=>a.type===k).length}</b><span>${v}</span></button>`).join('')}</div>`;
 $('#pick').style.display=picking?'flex':'none';
 let items=lib.filter(a=>filter==='all'||a.type===filter);
 items.sort((a,b)=>(b.id===defId)-(a.id===defId));
 $('#list').innerHTML=items.length?items.map(row).join(''):'<p class="empty">Nothing here yet. Add one on the right.</p>';
 $('#types').innerHTML=Object.entries(TYPES).map(([k,v])=>`<button class="tile ${kind===k?'on':''}" data-k="${k}">${svg(k)}<span>${v}</span></button>`).join('');
 renderForm();
}
function renderForm(){
 const name=`<div class="f"><span class="label">Name</span><input id="n" maxlength="40" placeholder="${{breathing:'My evening wind-down',custom:'Walk outside',youtube:'Dance break',spotify:'Calm playlist'}[kind]}"></div>`;
 let h=name;
 if(kind==='breathing')h+=`<div class="f"><span class="label">Phases</span>${phases.map((p,i)=>`<div class="ph"><input data-pl="${i}" value="${esc(p.l)}" placeholder="Label"><input data-ps="${i}" type="number" min="1" max="30" value="${p.s}"><button class="x" data-rp="${i}" aria-label="Remove phase">${x}</button></div>`).join('')}</div>
  <button class="pill addph" id="addph">+ Add phase</button><div class="f"><div class="cyc">${phases.map((p,i)=>`<i style="flex:${p.s||1};opacity:${i%2?.3:.85}"></i>`).join('')}</div><div class="cl">${phases.map(p=>`<span style="flex:${p.s||1}">${esc(p.l)}</span>`).join('')}</div></div><span class="hint" id="ch">Cycle: ${phases.reduce((n,p)=>n+(+p.s||0),0)}s · repeats until rest ends</span>`;
 if(kind==='custom')h+=`<div class="f"><span class="label">Minutes</span><input id="m" type="number" min="1" max="60" value="10"></div><span class="hint">Timed: ends on its own</span>`;
 if(kind==='youtube'||kind==='spotify')h+=`<div class="f"><span class="label">${TYPES[kind]} link</span><input id="u" placeholder="${kind==='youtube'?'https://youtube.com/watch?v=…':'https://open.spotify.com/…'}"></div><span class="hint">Plays in the rest screen · you end it with “I'm done”</span>`;
 h+=`<div class="f"><span class="label">${kind==='custom'?'Note shown on screen':'Note (optional)'}</span><textarea id="note" maxlength="120" placeholder="${kind==='custom'?'Take a walk. Leave your phone.':'A reminder for yourself'}"></textarea></div>`;
 $('#form').innerHTML=h;
}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.f){filter=filter===d.f?'all':d.f}else if(d.k){kind=d.k;$('#err').textContent=''}
 else if(d.def){defId=defId===d.def?null:d.def}
 else if(d.use){chosen=d.use}
 else if(d.del){lib=lib.filter(a=>a.id!==d.del);if(defId===d.del)defId=null;if(chosen===d.del)chosen=null}
 else if(t.id==='cancel'){picking=false;chosen=null}
 else if(d.rp!==undefined){if(phases.length>1)phases.splice(+d.rp,1)}
 else if(t.id==='addph'){phases.push({l:'Hold',s:4})}
 else if(t.id==='add'){return add()}
 else return;
 render()});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.pl!==undefined)phases[d.pl].l=e.target.value;if(d.ps!==undefined){phases[d.ps].s=+e.target.value;$('.cyc').innerHTML=phases.map((p,i)=>`<i style="flex:${p.s||1};opacity:${i%2?.3:.85}"></i>`).join('');$('#ch').textContent=`Cycle: ${phases.reduce((n,p)=>n+(+p.s||0),0)}s · repeats until rest ends`}});
function add(){const name=$('#n').value.trim(),err=m=>$('#err').textContent=m;
 if(!name)return err('Give it a name.');
 let a={id:'u'+id++,type:kind,name};
 if(kind==='breathing'){const ps=phases.filter(p=>p.l.trim()&&p.s>0);if(!ps.length)return err('Add at least one phase.');a.phases=ps.map(p=>[p.l.trim(),+p.s])}
 if(kind==='custom'){a.min=Math.max(1,Math.min(60,+$('#m').value||10))}
 if(kind==='youtube'||kind==='spotify'){const u=$('#u').value.trim();const ok=kind==='youtube'?/(youtube\.com|youtu\.be)/i.test(u):/spotify\.com/i.test(u);if(!ok)return err(`Paste a valid ${TYPES[kind]} link.`);a.url=u}
 a.note=$('#note').value.trim();lib.push(a);err('');filter='all';if(kind==='breathing')phases=[{l:'Inhale',s:4},{l:'Exhale',s:6}];render();
 const l=$('#list');l.scrollTop=l.scrollHeight}
$('#tg').onclick=()=>$('#app').classList.toggle('collapsed');
render();
</script>
</body>
</html>
