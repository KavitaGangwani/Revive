<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still — Focus</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Reference file only: same Google Fonts link as splash.html. In the Electron app this is replaced by the bundled @fontsource/jetbrains-mono (400, 500). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--bg-deep:#020407;--glow-backdrop:rgba(40,95,160,.20);
  --accent:#AFDDFF;--accent-hi:#C8E8FF;--accent-core:#F2FAFF;
  --text:#fff;--muted:rgba(255,255,255,.5);--faint:rgba(255,255,255,.28);
  --track:rgba(255,255,255,.10);--hair:rgba(255,255,255,.08);--hud-border:rgba(255,255,255,.12);
  /* Provisional: same face as the splash. In Electron this is the bundled @fontsource/jetbrains-mono */
  --font-label:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --font-display:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-label)}
body{display:grid;place-items:center}
.app{width:900px;height:720px;display:flex;background:var(--bg);border:1px solid var(--hair);overflow:hidden;position:relative}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 45% 38% at 60% 32%,var(--glow-backdrop),transparent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-transform:inherit;letter-spacing:inherit}
.app{text-transform:uppercase;letter-spacing:.04em}
button:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}

/* Stars (same idea as the splash, far fewer and fainter) */
.stars{position:absolute;inset:0;pointer-events:none;z-index:0}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--accent-core);opacity:.1;animation:tw var(--d) ease-in-out var(--l) infinite}
@keyframes tw{50%{opacity:.7}}

/* Sidebar */
.side{width:216px;flex:none;border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:16px 12px;gap:4px;
  transition:width 1.1s var(--ease-out);position:relative;z-index:1;background:rgba(2,4,7,.85)}
.app.collapsed .side{width:64px}
.side-top{display:flex;align-items:center;justify-content:space-between;height:40px;margin-bottom:16px;padding:0 6px}
.brand{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.app.collapsed .brand{display:none}
.app.collapsed .side-top{justify-content:center;padding:0}
.icon-btn{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--text);background:var(--hair)}
.nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:999px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;width:100%;text-align:left}
svg{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav svg,.icon-btn svg{width:18px;height:18px;flex:none}
.nav:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav.active{color:var(--accent);background:rgba(175,221,255,.08)}
.nav.active svg{filter:drop-shadow(0 0 4px rgba(175,221,255,.6))}
.app.collapsed .nav{padding:0;justify-content:center}
.app.collapsed .nav span{display:none}
.spacer{flex:1}

/* Main: two columns like the Clock app */
.main{flex:1;min-width:0;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:16px;position:relative;z-index:1}
.card{position:relative;border:1px solid var(--hair);border-radius:20px;background:rgba(255,255,255,.025);padding:22px 20px;min-height:0}
/* luminous top edge */
.card::before{content:"";position:absolute;top:-1px;left:18%;right:18%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(175,221,255,.55),transparent)}

/* "Get ready to focus" card */
.focus{display:flex;flex-direction:column;align-items:center;text-align:center}
.focus h1{font-family:var(--font-display);font-weight:500;font-size:18px;letter-spacing:.06em;margin-top:6px}
.desc{font-size:12px;line-height:1.7;color:var(--muted);margin-top:10px;max-width:34ch}
.cap{margin:26px 0 8px}
.cap.sm{margin-top:20px}
.counter{display:flex;border:1px solid var(--hud-border);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.02)}
.counter .num{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 0}
.counter b{font-family:var(--font-display);font-weight:400;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1;text-shadow:0 0 16px rgba(175,221,255,.45)}
.counter .num span{font-size:10px;color:var(--muted);margin-top:6px}
.chev{display:flex;flex-direction:column;border-left:1px solid var(--hud-border)}
.chev button{flex:1;display:grid;place-items:center;color:var(--muted);transition:color .2s,background .2s}
.chev button+button{border-top:1px solid var(--hud-border)}
.chev button:hover{color:var(--accent);background:rgba(175,221,255,.07)}
.chev svg{width:16px;height:16px}
.counter.big{width:164px;height:100px}
.counter.big .num{flex:1}.counter.big b{font-size:40px}
.counter.mini{width:100%;height:68px}
.counter.mini .num{flex:1}.counter.mini b{font-size:26px}.counter.mini .num span{margin-top:4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:260px}
.pair>div{display:flex;flex-direction:column;align-items:center}
.note{font-size:12px;color:var(--muted);margin-top:22px}
.btn{margin-top:auto;height:44px;padding:0 28px;border-radius:999px;background:var(--accent);color:#000;font-weight:500;font-size:13px;display:flex;align-items:center;gap:10px;transition:background .2s}
.btn:hover{background:var(--accent-hi)}
.btn svg{width:14px;height:14px;fill:#000;stroke:none}

/* Rest activities card */
.rest{display:flex;flex-direction:column}
.rest h2{font-family:var(--font-display);font-weight:500;font-size:16px}
.rest-sub{font-size:11px;color:var(--faint);line-height:1.7;margin:8px 0 16px}
.slots{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--track) transparent}
.slot{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--hair);border-radius:16px;padding:12px 14px;transition:border-color .6s}
.slot.set{border-color:rgba(175,221,255,.35)}
.slot .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot .name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.set .name{color:var(--text)}
.pill{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--hud-border);font-size:11px;white-space:nowrap;flex:none;transition:border-color .2s,color .2s}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-right:8px;vertical-align:1px}
.slot.set .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
@media (prefers-reduced-motion:reduce){.side{transition:none}.stars i{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stars" id="stars"></div>

  <aside class="side">
    <div class="side-top">
      <span class="brand">Still</span>
      <button class="icon-btn" id="toggle" aria-label="Collapse sidebar" title="Collapse sidebar">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
      </button>
    </div>
    <button class="nav active" title="Focus"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></svg><span>Focus</span></button>
    <button class="nav" title="Activities"><svg viewBox="0 0 24 24"><path d="M4 12h3l2.5-6 4 12 2.5-6H20"/></svg><span>Activities</span></button>
    <div class="spacer"></div>
    <button class="nav" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.5 1.5M16.5 16.5L18 18M6 18l1.5-1.5M16.5 7.5L18 6"/></svg><span>Settings</span></button>
  </aside>

  <main class="main">
    <section class="card focus">
      <h1>Get ready to focus</h1>
      <p class="desc">When focus ends, Still takes over the screen so you actually rest.</p>

      <span class="label cap">Focus</span>
      <div class="counter big" data-key="focus" data-step="5">
        <div class="num"><b>30</b><span>mins</span></div>
        <div class="chev">
          <button data-d="1" aria-label="More focus time"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
          <button data-d="-1" aria-label="Less focus time"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
      </div>

      <div class="pair cap sm">
        <div><span class="label" style="margin-bottom:8px">Rest</span>
          <div class="counter mini" data-key="rest" data-step="1">
            <div class="num"><b>5</b><span>mins</span></div>
            <div class="chev">
              <button data-d="1" aria-label="More rest time"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
              <button data-d="-1" aria-label="Less rest time"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
            </div>
          </div></div>
        <div><span class="label" style="margin-bottom:8px">Rounds</span>
          <div class="counter mini" data-key="loops" data-step="1">
            <div class="num"><b>2</b><span>today</span></div>
            <div class="chev">
              <button data-d="1" aria-label="More rounds"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
              <button data-d="-1" aria-label="Fewer rounds"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
            </div>
          </div></div>
      </div>

      <p class="note" id="note"></p>
      <button class="btn"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>Start session</button>
    </section>

    <section class="card rest">
      <h2>Rest activities</h2>
      <p class="rest-sub">Choose what you'll do in each rest. Empty ones use your default, or ask you when the time comes.</p>
      <div class="slots" id="slots"></div>
    </section>
  </main>
</div>

<script>
const state={focus:30,rest:5,loops:2},limits={focus:[5,180],rest:[1,60],loops:[1,8]};
const chosen=[];  // placeholder; real data comes from the Library
const $=s=>document.querySelector(s);
function render(){
  document.querySelectorAll('.counter').forEach(c=>c.querySelector('b').textContent=state[c.dataset.key]);
  const n=state.loops,t=n*(state.focus+state.rest),h=Math.floor(t/60),m=t%60;
  $('#note').textContent=`You'll have ${n} rest${n>1?'s':''} · about ${h?h+'h ':''}${m?m+'m':''}`.trim();
  $('#slots').innerHTML=Array.from({length:n},(_,i)=>{const a=chosen[i];
    return `<div class="slot ${a?'set':''}"><div class="t"><span class="label">Rest ${i+1}</span>
    <span class="name"><i class="dot"></i>${a||'No activity chosen'}</span></div>
    <button class="pill" data-i="${i}">${a?'Change':'Choose activity'}</button></div>`}).join('');
}
document.querySelectorAll('.chev button').forEach(b=>b.addEventListener('click',()=>{
  const c=b.closest('.counter'),k=c.dataset.key,[lo,hi]=limits[k];
  state[k]=Math.min(hi,Math.max(lo,state[k]+ +b.dataset.d*+c.dataset.step));render();
}));
// Demo only: stands in for navigating to the Activities screen
$('#slots').addEventListener('click',e=>{const p=e.target.closest('.pill');if(!p)return;
  chosen[p.dataset.i]=chosen[p.dataset.i]?null:'Box breathing';render();});
$('#toggle').addEventListener('click',()=>{const c=$('#app').classList.toggle('collapsed');
  $('#toggle').title=c?'Expand sidebar':'Collapse sidebar';});
for(let i=0;i<40;i++){const s=document.createElement('i');
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${3+Math.random()*5}s;--l:-${Math.random()*8}s`;
  $('#stars').appendChild(s);}
render();
</script>
</body>
</html>
