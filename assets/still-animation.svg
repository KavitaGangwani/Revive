<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Radiant ambient radial glow with enhanced cyan luminescence -->
    <radialGradient id="ambient-cyan-vibrant" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4aa3ff" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#1e68b5" stop-opacity="0.08" />
      <stop offset="85%" stop-color="#0d2847" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Enhanced vibrant neon glow filter (subtle bright, crisp neon aura) -->
    <filter id="vibrant-neon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur1" />
      <feGaussianBlur stdDeviation="6.5" result="blur2" />
      <feGaussianBlur stdDeviation="15" result="blur3" />
      <feGaussianBlur stdDeviation="28" result="blur4" />
      <feMerge>
        <feMergeNode in="blur4" />
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="core-hot-plasma" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="coreBlur" />
      <feComponentTransfer in="coreBlur" result="boostedCore">
        <feFuncA type="linear" slope="1.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boostedCore" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Vibrant bright liquid flow gradient -->
    <linearGradient id="vibrant-cyan-stream" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#e2f5ff" />
      <stop offset="25%" stop-color="#93d5ff" />
      <stop offset="60%" stop-color="#47a5f5" />
      <stop offset="100%" stop-color="#1d6ec7" />
    </linearGradient>

    <!-- Cold glass tube outline gradient (no tilt, clean transparency) -->
    <linearGradient id="empty-glass-tube" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#a8dcff" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#4a95db" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#16436e" stop-opacity="0.06" />
    </linearGradient>

    <style>
      /*
        Identical calligraphic continuous stroke path for "still" (enlarged connecting 's'):
        Total continuous path length ~ 2400px.
        No tilt applied (rotation: 0deg, completely upright and balanced horizontally).
      */
      @keyframes brush-draw-vibrant {
        0% {
          stroke-dashoffset: 2400;
          opacity: 0;
        }
        4% {
          opacity: 1;
        }
        68% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        88% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        96% {
          stroke-dashoffset: 0;
          opacity: 0.3;
        }
        100% {
          stroke-dashoffset: 2400;
          opacity: 0;
        }
      }

      @keyframes cross-draw-vibrant {
        0%, 34% {
          stroke-dashoffset: 110;
          opacity: 0;
        }
        42% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        88% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        96% {
          opacity: 0;
        }
        100% {
          stroke-dashoffset: 110;
          opacity: 0;
        }
      }

      @keyframes dot-fade-vibrant {
        0%, 50% {
          opacity: 0;
          transform: scale(0.2);
        }
        58% {
          opacity: 1;
          transform: scale(1.2);
        }
        64% {
          opacity: 0.95;
          transform: scale(1);
        }
        88% {
          opacity: 0.95;
        }
        96% {
          opacity: 0;
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes aura-breathing {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.05); }
      }

      .animated-continuous-outer {
        stroke-dasharray: 2400;
        stroke-dashoffset: 2400;
        animation: brush-draw-vibrant 5.8s cubic-bezier(0.38, 0, 0.22, 1) infinite;
      }

      .animated-crossbar {
        stroke-dasharray: 110;
        stroke-dashoffset: 110;
        animation: cross-draw-vibrant 5.8s cubic-bezier(0.38, 0, 0.22, 1) infinite;
      }

      .animated-dot {
        transform-origin: 622px 255px;
        animation: dot-fade-vibrant 5.8s ease-in-out infinite;
      }

      .ambient-pulse {
        transform-origin: 600px 300px;
        animation: aura-breathing 5.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Pitch Black Backing -->
  <rect fill="#000000" width="100%" height="100%" />

  <!-- Ambient Radial Cyan Halo -->
  <ellipse class="ambient-pulse" cx="600" cy="300" rx="490" ry="230" fill="url(#ambient-cyan-vibrant)" />

  <!-- Minimal Technical HUD Grid Backdrop (Faint telemetry) -->
  <g opacity="0.18">
    <g stroke="#78b8e6" stroke-width="0.5">
      <line x1="260" y1="170" x2="270" y2="170" />
      <line x1="265" y1="165" x2="265" y2="175" />
      <line x1="930" y1="170" x2="940" y2="170" />
      <line x1="935" y1="165" x2="935" y2="175" />
      <line x1="310" y1="440" x2="320" y2="440" />
      <line x1="315" y1="435" x2="315" y2="445" />
      <line x1="880" y1="440" x2="890" y2="440" />
      <line x1="885" y1="435" x2="885" y2="445" />
    </g>
    <rect x="280" y="190" width="160" height="130" fill="none" stroke="#78b8e6" stroke-width="0.4" stroke-dasharray="2 3" />
    <rect x="740" y="180" width="170" height="140" fill="none" stroke="#78b8e6" stroke-width="0.4" />
    <rect x="520" y="320" width="180" height="120" fill="none" stroke="#78b8e6" stroke-width="0.4" />
  </g>

  <!--
    UPRIGHT / NO-TILT CALLIGRAPHIC CONTINUOUS WORDMARK "still"
    Zero degree tilt, centered perfectly at (600, 300).
  -->
  <g id="calligraphy-greatvibes-upright">
    <!-- LAYER 1: Translucent Unlit Glass Outer Tube -->
    <path d="M 340 385 C 362 390, 395 330, 420 270 C 430 245, 438 230, 442 232 C 448 236, 478 285, 475 335 C 472 368, 452 388, 430 388 C 412 388, 405 375, 416 362 C 428 350, 448 356, 472 366 C 496 376, 518 375, 532 355 C 536 348, 536 310, 536 245 C 536 225, 534 220, 532 220 C 530 220, 530 245, 532 335 C 534 362, 550 374, 578 358 C 596 346, 610 318, 614 300 C 616 295, 616 302, 614 322 C 612 350, 622 372, 646 360 C 668 348, 680 305, 686 245 C 690 198, 685 180, 675 180 C 664 180, 658 205, 658 265 C 658 335, 672 370, 702 360 C 728 348, 746 305, 754 245 C 758 198, 752 180, 742 180 C 730 180, 724 205, 724 265 C 724 335, 736 370, 768 360 C 790 350, 814 336, 835 325" fill="none" opacity="0.32" stroke="url(#empty-glass-tube)" stroke-linecap="round" stroke-linejoin="round" stroke-width="15" />
    
    <!-- t crossbar unlit tube -->
    <path d="M 500 282 Q 538 279 576 278" fill="none" opacity="0.28" stroke="url(#empty-glass-tube)" stroke-linecap="round" stroke-width="12" />
    
    <!-- LAYER 2: Wide Radiant Cyan Gas Bloom (Bright neon diffusion) -->
    <path class="animated-continuous-outer" d="M 340 385 C 362 390, 395 330, 420 270 C 430 245, 438 230, 442 232 C 448 236, 478 285, 475 335 C 472 368, 452 388, 430 388 C 412 388, 405 375, 416 362 C 428 350, 448 356, 472 366 C 496 376, 518 375, 532 355 C 536 348, 536 310, 536 245 C 536 225, 534 220, 532 220 C 530 220, 530 245, 532 335 C 534 362, 550 374, 578 358 C 596 346, 610 318, 614 300 C 616 295, 616 302, 614 322 C 612 350, 622 372, 646 360 C 668 348, 680 305, 686 245 C 690 198, 685 180, 675 180 C 664 180, 658 205, 658 265 C 658 335, 672 370, 702 360 C 728 348, 746 305, 754 245 C 758 198, 752 180, 742 180 C 730 180, 724 205, 724 265 C 724 335, 736 370, 768 360 C 790 350, 814 336, 835 325" fill="none" filter="url(#vibrant-neon-glow)" opacity="0.45" stroke="#2575c9" stroke-linecap="round" stroke-linejoin="round" stroke-width="26" />
    
    <!-- LAYER 3: Flowing Luminous Liquid Neon Body (Vibrant electric cyan) -->
    <path class="animated-continuous-outer" d="M 340 385 C 362 390, 395 330, 420 270 C 430 245, 438 230, 442 232 C 448 236, 478 285, 475 335 C 472 368, 452 388, 430 388 C 412 388, 405 375, 416 362 C 428 350, 448 356, 472 366 C 496 376, 518 375, 532 355 C 536 348, 536 310, 536 245 C 536 225, 534 220, 532 220 C 530 220, 530 245, 532 335 C 534 362, 550 374, 578 358 C 596 346, 610 318, 614 300 C 616 295, 616 302, 614 322 C 612 350, 622 372, 646 360 C 668 348, 680 305, 686 245 C 690 198, 685 180, 675 180 C 664 180, 658 205, 658 265 C 658 335, 672 370, 702 360 C 728 348, 746 305, 754 245 C 758 198, 752 180, 742 180 C 730 180, 724 205, 724 265 C 724 335, 736 370, 768 360 C 790 350, 814 336, 835 325" fill="none" filter="url(#vibrant-neon-glow)" opacity="0.95" stroke="url(#vibrant-cyan-stream)" stroke-linecap="round" stroke-linejoin="round" stroke-width="12" />
    
    <!-- LAYER 4: Bright Glowing Filament Arc Core (Subtle high intensity without blinding glare) -->
    <path class="animated-continuous-outer" d="M 340 385 C 362 390, 395 330, 420 270 C 430 245, 438 230, 442 232 C 448 236, 478 285, 475 335 C 472 368, 452 388, 430 388 C 412 388, 405 375, 416 362 C 428 350, 448 356, 472 366 C 496 376, 518 375, 532 355 C 536 348, 536 310, 536 245 C 536 225, 534 220, 532 220 C 530 220, 530 245, 532 335 C 534 362, 550 374, 578 358 C 596 346, 610 318, 614 300 C 616 295, 616 302, 614 322 C 612 350, 622 372, 646 360 C 668 348, 680 305, 686 245 C 690 198, 685 180, 675 180 C 664 180, 658 205, 658 265 C 658 335, 672 370, 702 360 C 728 348, 746 305, 754 245 C 758 198, 752 180, 742 180 C 730 180, 724 205, 724 265 C 724 335, 736 370, 768 360 C 790 350, 814 336, 835 325" fill="none" filter="url(#core-hot-plasma)" opacity="0.9" stroke="#ebf7ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.2" />
    
    <!-- LAYER 5: Pure White Specular Tube Reflection Spine -->
    <path class="animated-continuous-outer" d="M 340 385 C 362 390, 395 330, 420 270 C 430 245, 438 230, 442 232 C 448 236, 478 285, 475 335 C 472 368, 452 388, 430 388 C 412 388, 405 375, 416 362 C 428 350, 448 356, 472 366 C 496 376, 518 375, 532 355 C 536 348, 536 310, 536 245 C 536 225, 534 220, 532 220 C 530 220, 530 245, 532 335 C 534 362, 550 374, 578 358 C 596 346, 610 318, 614 300 C 616 295, 616 302, 614 322 C 612 350, 622 372, 646 360 C 668 348, 680 305, 686 245 C 690 198, 685 180, 675 180 C 664 180, 658 205, 658 265 C 658 335, 672 370, 702 360 C 728 348, 746 305, 754 245 C 758 198, 752 180, 742 180 C 730 180, 724 205, 724 265 C 724 335, 736 370, 768 360 C 790 350, 814 336, 835 325" fill="none" opacity="0.8" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3" />
    
    <!-- T-CROSSBAR (Vibrant neon styling) -->
    <path class="animated-crossbar" d="M 500 282 Q 538 279 576 278" fill="none" filter="url(#vibrant-neon-glow)" opacity="0.88" stroke="#3d91eb" stroke-linecap="round" stroke-width="11" />
    <path class="animated-crossbar" d="M 500 282 Q 538 279 576 278" fill="none" opacity="0.85" stroke="#e8f5ff" stroke-linecap="round" stroke-width="3" />
    <path class="animated-crossbar" d="M 500 282 Q 538 279 576 278" fill="none" opacity="0.7" stroke="#ffffff" stroke-linecap="round" stroke-width="1" />
    
    <!-- I-DOT ACCENT (Bright vibrant meniscus spark above the 'i') -->
    <g class="animated-dot">
      <circle cx="622" cy="255" r="18" fill="#297ad6" filter="url(#vibrant-neon-glow)" opacity="0.45" />
      <circle cx="622" cy="255" r="7.5" fill="#7ac3fc" filter="url(#core-hot-plasma)" opacity="0.95" />
      <circle cx="622" cy="255" r="3.2" fill="#ffffff" opacity="0.95" />
    </g>
    
    <!-- Glass terminal end caps -->
    <circle cx="340" cy="385" r="4.5" fill="#67aee0" opacity="0.6" />
    <circle cx="340" cy="385" r="1.8" fill="#ffffff" opacity="0.85" />
    <circle cx="835" cy="325" r="4.5" fill="#67aee0" opacity="0.6" />
    <circle cx="835" cy="325" r="1.8" fill="#ffffff" opacity="0.85" />
  </g>
</svg>
