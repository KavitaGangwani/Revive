<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Ambient diffused cyan radial glow -->
    <radialGradient id="neon-revive-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4aa3ff" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#1e68b5" stop-opacity="0.08" />
      <stop offset="85%" stop-color="#0d2847" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Multi-stage 3D Neon Gas Bloom Filter -->
    <filter id="neon-revive-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur1" />
      <feGaussianBlur stdDeviation="6.5" result="blur2" />
      <feGaussianBlur stdDeviation="15" result="blur3" />
      <feGaussianBlur stdDeviation="28" result="blur4" />
      <feMerge>
        <feMergeNode in="blur4" />
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Hot plasma intense core glow filter -->
    <filter id="neon-revive-core" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="coreBlur" />
      <feComponentTransfer in="coreBlur" result="boostCore">
        <feFuncA type="linear" slope="1.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boostCore" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Liquid luminous neon flow gradient for the primary tube body -->
    <linearGradient id="neon-revive-stream" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#e2f5ff" />
      <stop offset="25%" stop-color="#93d5ff" />
      <stop offset="60%" stop-color="#47a5f5" />
      <stop offset="100%" stop-color="#1d6ec7" />
    </linearGradient>

    <!-- Cold glass tube outline gradient -->
    <linearGradient id="empty-glass-tube" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#a8dcff" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#4a95db" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#16436e" stop-opacity="0.06" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lavishly+Yours&amp;display=swap');

      /* Continuous handwriting write-in loop for "Revive" with Lavishly Yours cursive strokes */
      @keyframes revive-handwrite-neon {
        0% {
          stroke-dashoffset: 2600;
          opacity: 0;
        }
        4% {
          opacity: 1;
        }
        68% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        88% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        96% {
          stroke-dashoffset: 0;
          opacity: 0.25;
        }
        100% {
          stroke-dashoffset: 2600;
          opacity: 0;
        }
      }

      /* Synchronized spark & glow for the 'i' dot */
      @keyframes idot-neon-ignite {
        0%, 50% {
          opacity: 0;
          transform: scale(0.2);
        }
        58% {
          opacity: 1;
          transform: scale(1.25);
        }
        64% {
          opacity: 0.95;
          transform: scale(1);
        }
        88% {
          opacity: 0.95;
          transform: scale(1);
        }
        96% {
          opacity: 0;
          transform: scale(0.3);
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes aura-breathing {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.05); }
      }

      .font-lavishly {
        font-family: 'Lavishly Yours', cursive, sans-serif;
      }

      .animated-continuous-outer {
        stroke-dasharray: 2600;
        stroke-dashoffset: 2600;
        animation: revive-handwrite-neon 5.8s cubic-bezier(0.38, 0, 0.22, 1) infinite;
      }

      .animated-dot {
        transform-origin: 668px 230px;
        animation: idot-neon-ignite 5.8s ease-in-out infinite;
      }

      .ambient-pulse {
        transform-origin: 600px 300px;
        animation: aura-breathing 5.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Pitch Black Canvas -->
  <rect fill="#000000" width="100%" height="100%" />

  <!-- Ambient Radial Cyan Halo -->
  <ellipse class="ambient-pulse" cx="600" cy="300" rx="490" ry="230" fill="url(#neon-revive-ambient)" />

  <!-- Minimal Technical Coordinates & Telemetry Framing -->
  <g opacity="0.18">
    <g stroke="#78b8e6" stroke-width="0.5">
      <line x1="220" y1="140" x2="230" y2="140" />
      <line x1="225" y1="135" x2="225" y2="145" />
      <circle cx="225" cy="140" r="1" fill="#d2edff" />
      <line x1="980" y1="180" x2="990" y2="180" />
      <line x1="985" y1="175" x2="985" y2="185" />
      <circle cx="985" cy="180" r="1" fill="#d2edff" />
      <line x1="340" y1="460" x2="350" y2="460" />
      <line x1="345" y1="455" x2="345" y2="465" />
      <circle cx="345" cy="460" r="1" fill="#d2edff" />
      <line x1="880" y1="440" x2="890" y2="440" />
      <line x1="885" y1="435" x2="885" y2="445" />
      <circle cx="885" cy="440" r="1" fill="#d2edff" />
    </g>
    <rect x="250" y="160" width="180" height="150" fill="none" stroke="#78b8e6" stroke-width="0.4" stroke-dasharray="2 3" />
    <rect x="680" y="130" width="220" height="170" fill="none" stroke="#78b8e6" stroke-width="0.4" />
    <rect x="480" y="320" width="200" height="130" fill="none" stroke="#78b8e6" stroke-width="0.4" />
  </g>

  <!-- Central "Revive" Wordmark: Lavishly Yours with multi-layer neon stroke animations -->
  <g id="wordmark-revive-group" transform="translate(600, 300) rotate(-4) translate(-600, -300)">
    <!-- LAYER 0: Translucent Unlit Glass Outer Tube -->
    <text class="font-lavishly" x="590" y="375" text-anchor="middle" font-size="280" fill="none" stroke="url(#empty-glass-tube)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.32">
      Revive
    </text>

    <!-- LAYER 1: Deep Cyan Ambient Gas Bloom (Wide diffusion neon aura) -->
    <text class="font-lavishly animated-continuous-outer" x="590" y="375" text-anchor="middle" font-size="280" fill="none" stroke="#2575c9" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-revive-glow)" opacity="0.5">
      Revive
    </text>

    <!-- LAYER 2: Radiant Liquid Neon Tube Body (Vibrant electric cyan stream) -->
    <text class="font-lavishly animated-continuous-outer" x="590" y="375" text-anchor="middle" font-size="280" fill="none" stroke="url(#neon-revive-stream)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-revive-glow)" opacity="0.95">
      Revive
    </text>

    <!-- LAYER 3: Core Hot Plasma Arc Core (High intensity hot filament core) -->
    <text class="font-lavishly animated-continuous-outer" x="590" y="375" text-anchor="middle" font-size="280" fill="none" stroke="#ebf7ff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-revive-core)" opacity="0.92">
      Revive
    </text>

    <!-- LAYER 4: Pure White Specular Tube Reflection Spine -->
    <text class="font-lavishly animated-continuous-outer" x="589.5" y="374" text-anchor="middle" font-size="280" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      Revive
    </text>

    <!-- Synchronized 'i'-dot ignition spark above the 'i' in Revive -->
    <g class="animated-dot">
      <circle cx="668" cy="230" r="18" fill="#297ad6" filter="url(#neon-revive-glow)" opacity="0.45" />
      <circle cx="668" cy="230" r="7" fill="#7ac3fc" filter="url(#neon-revive-core)" opacity="0.95" />
      <circle cx="668" cy="230" r="2.8" fill="#ffffff" opacity="0.95" />
    </g>
  </g>
</svg>
